# ============================================
# MOSQUITTO MQTT BROKER CONFIGURATION
# ============================================

# Listener on all interfaces, port 1883 (plain MQTT)
listener 1883
allow_anonymous true

# Listener for WebSocket connections, port 9001
listener 9001
protocol websockets
allow_anonymous true

# Persistence: store subscriptions and messages across restarts
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
connection_messages true
log_timestamp true

# Maximum message size (1MB)
message_size_limit 1048576
