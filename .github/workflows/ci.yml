name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python-service

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: monitoring
          POSTGRES_USER: zabbix
          POSTGRES_PASSWORD: zabbix_secret_2024
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U zabbix -d monitoring"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: python-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linter
        run: |
          pip install ruff
          ruff check .

      - name: Run MyPy type checker
        run: |
          pip install mypy
          mypy app --ignore-missing-imports || true

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U zabbix -d monitoring && break
            sleep 1
          done

      - name: Run database migrations
        run: |
          PGPASSWORD=zabbix_secret_2024 psql -h localhost -U zabbix -d monitoring -f ../database/migrations/002_monitoring_tables.sql

      - name: Run tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: monitoring
          POSTGRES_USER: zabbix
          POSTGRES_PASSWORD: zabbix_secret_2024
          TZ: UTC
          MONITORING_DB: monitoring
        run: |
          pytest tests/ -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build python-service image
        run: |
          docker build -t monitoring-python-service:test ./python-service

      - name: Verify docker-compose syntax
        run: |
          docker compose config > /dev/null